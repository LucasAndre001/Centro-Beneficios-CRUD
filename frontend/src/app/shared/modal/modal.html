<div class="backdrop" (click)="close()"></div>
<section
  #panel
  class="panel"
  [class]="size()"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
  tabindex="-1"
>
  <header class="head">
    <ng-content select="[modalLead]" />
    <div class="titles">
      <h2 [id]="titleId">{{ heading() }}</h2>
      @if (subtitle()) {
        <span class="small muted">{{ subtitle() }}</span>
      }
    </div>
    @if (closable()) {
      <button type="button" class="icon-btn" aria-label="Fechar" (click)="close()">
        <app-icon name="close" />
      </button>
    }
  </header>
  <ng-content />
</section>
