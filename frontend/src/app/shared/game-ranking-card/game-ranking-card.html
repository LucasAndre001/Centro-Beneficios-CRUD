<h2 class="card-title">Ranking do jogo</h2>

@if (games().length > 0) {
  <app-tabs label="Jogos disponíveis" [options]="tabs()" [(value)]="selected" />
}

@if (loading()) {
  <p class="empty">Carregando...</p>
} @else if (failed()) {
  <p class="empty">Não foi possível carregar o ranking.</p>
} @else if (ranking().length === 0) {
  <p class="empty">Ninguém jogou ainda. Seja o primeiro!</p>
} @else {
  <app-ranking-list [rows]="ranking()" [highlightUserId]="highlightUserId()" />
}

@if (showPlayLink()) {
  <a routerLink="/jogos" class="btn push-bottom">Jogar</a>
}
