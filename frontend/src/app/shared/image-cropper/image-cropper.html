<div
  #frame
  class="frame"
  tabindex="0"
  role="img"
  aria-label="Foto do produto no card da loja. Arraste ou use as setas para posicionar."
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp()"
  (pointercancel)="onPointerUp()"
  (keydown)="onKeydown($event)"
>
  <img
    [src]="src()"
    alt=""
    draggable="false"
    [style.left.%]="box().left"
    [style.top.%]="box().top"
    [style.width.%]="box().width"
    [style.height.%]="box().height"
  />
  <span class="hint" aria-hidden="true">arraste para posicionar</span>
</div>
